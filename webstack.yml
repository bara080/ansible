---
- name: Deploy web stack
  hosts: webservers
  become: true

  tasks:
    - name: Install nginx
      ansible.builtin.dnf:
        name: nginx
        state: present

    - name: Install git
      ansible.builtin.dnf:
        name: git
        state: present

    - name: Start nginx
      ansible.builtin.service:
        name: nginx
        enabled: true
        state: started

    - name: Open firewall
      ansible.posix.firewalld:
        service: http
        permanent: true
        state: enabled
        immediate: true